services:
  - type: web
    name: bhashasetu-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_TIMEOUT_MS
        value: 90000
      - key: MAX_UPLOAD_MB
        value: 8
